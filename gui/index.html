    <!-- GUI Port Management -->
    <script>
      var guiPort = "8008";
      var href = window.location.href;

      function setPort() {
        if (!href || !href.includes("?port=")){
          console.log("No port parameter found.\nUsing default port:", guiPort);
          return;
        }
          
        var regexPattern = "\\bport=(\\d{1,5})";
        var regex = new RegExp(regexPattern);
          
        var matches = href.match(regex);
          
        if (!matches && !matches[1]) {
          console.log("Port parameter contains an invalid value.\nUsing default port:", guiPort);
          return;
        }

        guiPort = matches[1];
        console.log("Set PORT to:", guiPort);
      }
    </script>
    
    <!-- Retrieving Local UserScripts -->
    <script>
      var baseServerURL = `http://127.0.0.1:${guiPort}`;
      var createScriptURL = `${baseServerURL}/create`
      var loadScriptsURL = `${baseServerURL}/load`
      var validateScriptURL = `${baseServerURL}/validate`
      var exportScriptURL = `${baseServerURL}/export`
      var restartGUIURL = `${baseServerURL}/restart`
      var terminateGUIURL = `${baseServerURL}/terminate`
      var localUserScripts = null;

      fetch(
        loadScriptsURL, 
        { 
          // headers: {'Content-Type': 'application/json'},
          method: "GET",
          // signal: AbortSignal.timeout(200)
        }
      )
      .then(response => {
        if (!response.ok) {
          throw new Error(`Invalid HTTP status: ${response.status}`);
        }
        return response.json();
      })
      .then(data => {
        // console.log(data);
        localUserScripts = data["Items"];
        console.log(localUserScripts);
      })
      .catch(error => {
        console.error('Error fetching data:', error);

        if (!href.includes("&disabled=true")){
          console.log('If this is intentional, please pass ?port=xyz&disabled=true');
          window.location.href = "inactive.html";
        }
      });

    </script>

    <!-- Create a Script Button Functionality -->
    <script>
      let currentlySelectedItem = null;

      var commandSelect = document.querySelector('#command-select');

      const commandItems = document.querySelectorAll('#command-list li');

      function handleSelection(event) {
        const newSelectedItem = event.currentTarget; 

        if (currentlySelectedItem !== null) {
          currentlySelectedItem.classList.remove('list-item');
        }
        newSelectedItem.classList.add('list-item');
        currentlySelectedItem = newSelectedItem;
      }
      
      commandItems.forEach(item => {
        item.addEventListener('click', handleSelection);
      });
      
      
      var selectedOption = commandSelect.children[0];

      if (selectedOption == null && commandItems.length != 0){
        alert("A fatal error has occured, please click \"Restart GUI\", or restart BAMM.");
        throw new Error("A fatal error has occured, please click \"Restart GUI\" or restart BAMM.");
      };

      try {
        selectedOption.setAttribute("selected", "");

        commandSelect.onchange = function(e) {
            var newSelectedOption = this.querySelector(`option[value="${e.target.value}"]`);
            if (selectedOption) {
                selectedOption.removeAttribute("selected");
            }
            if (newSelectedOption) {
                newSelectedOption.setAttribute("selected", "");
                selectedOption = newSelectedOption;
            }
        };
      }
    catch (error) {
      console.error(`An exception occured while trying to reset the combobox.\nException: ${error.message}`)
    }

      const createScriptBtn = document.querySelector("#resetScriptState");
      var commandsAdded = document.querySelectorAll("#command-list li");
      
      var originalSection = null;
      var currentSection = null;
      

      createScriptBtn.addEventListener("click", (e) => {
        clearCurrentScriptState(commandsAdded)

        if (currentSection && originalSection && currentSection.parentNode) {
            var parentEl = currentSection.parentNode;
            
            parentEl.replaceChild(originalSection, currentSection);
            currentSection = originalSection;
            originalSection = null;

            
            console.log('Successfully swapped to create section.');
        } else if (currentSection) {
            console.log(`Failed to swap to create section, it remains, ${currentSection.id}`);
        }
      });
    </script>
    
    <!-- Export Button Functionality -->
    <script>
      var exportScriptButton = document.querySelector(
        ".action-button.export-script-btn"
      );

      if (exportScriptButton == null){
        alert("The export button was not found, please make a bug report, if you are reading this.");
        throw new Error("The export button was not found, please make a bug report, if you are reading this.");
      }
      exportScriptButton.addEventListener("click", (e) => {
        
        var commandArray = getData();
        console.log(commandArray);
        if (commandArray == {} || commandArray == null)
        {
          alert(
            "Unable to access commands from local storage, please ensure atleast 2 commands are present before attempting to export a script. " +
            "If this issue persists, please make a bug report."
          );
          throw new Error(
            "Unable to access commands from local storage, please ensure atleast 2 commands are present before attempting to export a script. " +
            "If this issue persists, please make a bug report."
          );
        }
        
        
        var filename = prompt("Please enter your desired filename, it must end with .bamc");

        while (filename == null || !filename.endsWith(".bamc")){
          fileName = prompt("Please enter your desired filename, it must end with .bamc");
        }
        
        var commandString = Object.values(commandArray).join('\n');

        if (commandString == null || commandString == ""){
          alert(
            "Unable to sanitize commands from local storage, please ensure atleast 2 commands are present before attempting to export a script. " +
            "If this issue persists, please make a bug report."
          );
          throw new Error(
            "Unable to sanitize commands from local storage, please ensure atleast 2 commands are present before attempting to export a script. " +
            "If this issue persists, please make a bug report."
          );
        }
        console.log(commandString);

        var encodedFilename = encodeURIComponent(filename);
        var encodedContents = btoa(commandString);

        var url = `${exportScriptURL}?filename=${encodedFilename}&contents=${encodedContents}`
        
        fetch(
          url,
          {
            headers: {'Content-Type': 'application/json'},
            method: "GET",
            signal: AbortSignal.timeout(10000)
          }
        )
        .then(response => {
          if (!response.ok) {
            throw new Error(`Invalid HTTP status: ${response.status}`);
          }
          return response.json();
        })
        .then(data => {
          alert(`Successfully saved file: ${filename}`)
          console.log(`Response: ${data}`);
        })
        .catch(error => {
          alert('An error occured while attempting to export your file.\nError:', error);
        });

      });
      
    </script>
