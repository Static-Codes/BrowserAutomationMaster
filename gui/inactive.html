<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="styles/sidebar.css">
    </head>
    <body>
        <div style="color: white; width:100vw; text-align: center;">
            <h1 style="margin-top: 15vw;">BAMM's GUI is not currently active</h1>
            <br>
            <h2>To start BAMM with a GUI, please use either command:</h2>
            <br>
            <h3>
                <code style="font-weight: 100;">bamm --gui</code>
            </h3>
            <h3>
                <code style="font-weight: 100;">bamm --gui --port=10590</code>
            </h3>
            <br>
            <p><strong>The number 10590 can be any number between 1 and 65535.</strong></p>
            <br>
            <p><strong>If you run into issues with one port, try another number.</strong></p>
        </div>
    </body>
</html>
